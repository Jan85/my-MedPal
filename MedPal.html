<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>MedPal</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#7FD1AE;--mint:#7FD1AE;--mint-600:#5DBA93;--mint-700:#3E9E75;
  --mint-50:#EAF7F0;--mint-100:#D6EFDF;
  --beige:#F5EFE4;--cream:#FBF8F1;--paper:#FFFFFF;
  --coral:#E8896B;--amber:#E5B769;--sky:#7BB0D6;
  --ink:#1B2420;--ink-2:#3C4A44;--ink-3:#6B7A74;--ink-4:#9BA7A2;--hair:#E8E2D4;
  --sh-1:0 1px 2px rgba(27,36,32,.04),0 2px 8px rgba(27,36,32,.04);
  --sh-2:0 2px 6px rgba(27,36,32,.05),0 8px 24px rgba(27,36,32,.06);
  --sh-3:0 8px 24px rgba(27,36,32,.08),0 24px 48px rgba(27,36,32,.08);
  --sh-mint:0 8px 24px rgba(127,209,174,.30),0 2px 6px rgba(62,158,117,.15);
  --sans:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  --serif:"New York","SF Pro Display","Songti SC",Georgia,serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{background:var(--beige);min-height:100vh;font-family:var(--sans)}
@keyframes mp-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes mp-fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes mp-spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hair);border-radius:3px}

#app{height:100%;height:100dvh}

/* Screen layout */
.screen{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.screen-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen-pad{padding:0 20px 20px}

/* Status bar */
.sbar{height:calc(env(safe-area-inset-top,0px) + 50px);padding-top:env(safe-area-inset-top,0px);
  display:flex;align-items:flex-end;padding-bottom:10px;
  padding-left:24px;padding-right:20px;flex-shrink:0}
.sbar-time{font-size:15px;font-weight:700}
.sbar-icons{display:flex;gap:6px;align-items:center;margin-left:auto}

/* Tab bar */
.tabbar{border-top:1px solid var(--hair);display:flex;align-items:flex-start;
  padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
  flex-shrink:0;background:rgba(251,248,241,.96);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tab-btn{flex:1;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px}
.tab-label{font-size:10px;font-weight:500;line-height:1.2}

/* Nav pill — hidden on phone, visible on desktop for demo */
.nav-pill{position:fixed;top:14px;left:50%;transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:5px 6px;
  background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);border-radius:999px;z-index:500;
  box-shadow:0 4px 16px rgba(27,36,32,.10);max-width:calc(100vw - 24px)}
.nav-btn{border:none;cursor:pointer;padding:5px 10px;border-radius:999px;
  font-size:11px;font-weight:700;font-family:inherit;transition:all .15s;
  text-transform:capitalize}
@media(max-width:600px){.nav-pill{display:none}}

/* Buttons */
.btn{border:none;cursor:pointer;font-family:inherit;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;border-radius:14px;
  font-weight:600;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--sh-mint)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:var(--paper);color:var(--ink);box-shadow:var(--sh-1)}
.btn-icon{width:36px;height:36px;border-radius:12px;background:var(--paper);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1)}

/* Cards */
.card{background:var(--paper);border-radius:16px;box-shadow:var(--sh-1)}
.card-lg{border-radius:20px;box-shadow:var(--sh-2)}

/* Flip card */
.flip-card{perspective:1400px;cursor:pointer;height:310px;user-select:none;
  -webkit-tap-highlight-color:transparent}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.7,.1,.3,1)}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;
  backface-visibility:hidden;border-radius:22px;background:var(--paper);
  box-shadow:var(--sh-3);overflow:hidden}
.flip-back{transform:rotateY(180deg)}

/* Wave bars */
.wave-wrap{display:flex;gap:3px;align-items:center;height:18px}
.wave-bar{width:3px;background:var(--accent);border-radius:2px;height:100%;transform:scaleY(.35)}
.wave-bar.active{animation:mp-wave 1s infinite}
.wave-bar:nth-child(2).active{animation-delay:.1s}
.wave-bar:nth-child(3).active{animation-delay:.2s}
.wave-bar:nth-child(4).active{animation-delay:.3s}

/* Progress bar */
.prog-wrap{height:4px;background:var(--hair);border-radius:4px}
.prog-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .3s}

/* Tweaks */
.tweaks-btn{position:fixed;bottom:22px;right:22px;width:44px;height:44px;
  border-radius:14px;border:none;cursor:pointer;background:var(--paper);
  box-shadow:var(--sh-2);display:flex;align-items:center;justify-content:center;z-index:1001}
.tweaks-panel{position:fixed;bottom:76px;right:22px;background:var(--paper);
  border-radius:20px;padding:16px;width:228px;box-shadow:var(--sh-3);z-index:1000;
  animation:mp-fadein .2s ease;font-family:var(--sans)}

/* Input */
input{font-family:inherit;font-size:15px;color:var(--ink);outline:none;
  background:var(--paper);transition:border .2s;-webkit-appearance:none}

/* Tag */
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;
  padding:4px 9px;font-size:12px;font-weight:700}

/* Section label */
.sec-label{font-size:11px;font-weight:700;color:var(--ink-4);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:10px}

/* Body part / symptom buttons */
.chip-btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;
  padding:7px 12px;border-radius:10px;transition:all .15s;-webkit-tap-highlight-color:transparent}
</style>
</head>

  {id:95,level:2,word:'Diaphragm',ipa:'/ˈdaɪəfræm/',pos:'n.',zh:'膈肌',def:'The dome-shaped muscle below your lungs that controls breathing',
   sentence:'Hiccups happen when your diaphragm suddenly contracts involuntarily.',zhSentence:'打嗝是因为膈肌突然不自主地收缩。',mnemonic:'膈(gé) — the diaphragm separates the chest and abdomen; Dia-(through) + phragm(barrier)',book:'anatomy',emoji:'🫧'},
  // ── ANATOMY LEVEL 3 ──────────────────────────────────────────────────────
  {id:96,level:3,word:'Hemorrhoids',ipa:'/ˈhemərɔɪdz/',pos:'n.',zh:'痔疮',def:'Swollen veins in or around the rectum causing pain, itching, or bleeding',
   sentence:'The doctor recommended a high-fiber diet to help manage his hemorrhoids.',zhSentence:'医生建议他多吃高纤维食物来缓解痔疮。',mnemonic:'痔(zhì) — Hemorrhoid = hemo(blood) + rrhoid(flowing). Swollen blood vessels in the rectum',book:'anatomy',emoji:'🩸'},
  {id:97,level:3,word:'Hernia',ipa:'/ˈhɜːniə/',pos:'n.',zh:'疝气',def:'When an internal organ pushes through a weak spot in the surrounding muscle',
   sentence:'He was advised to avoid heavy lifting after being diagnosed with a hernia.',zhSentence:'被诊断为疝气后，医生建议他避免搬重物。',mnemonic:'疝(shàn) — sounds like "shan" (山=mountain); something bulging out like a little mountain',book:'anatomy',emoji:'⚠️'},
  {id:98,level:3,word:'Gastrointestinal',ipa:'/ˌɡæstrəʊɪnˈtestɪnəl/',pos:'adj.',zh:'胃肠的',def:'Relating to the stomach and intestines together',
   sentence:'She visited a specialist for gastrointestinal problems like bloating and cramping.',zhSentence:'她因腹胀和痉挛等胃肠问题去看了专科医生。',mnemonic:'胃肠(wèi cháng) — 胃=stomach, 肠=intestine. Gastro=stomach, intestinal=gut. Two words, one system',book:'anatomy',emoji:'🌿'},
  {id:99,level:3,word:'Osteoporosis',ipa:'/ˌɒstiəʊpəˈrəʊsɪs/',pos:'n.',zh:'骨质疏松',def:'A condition where bones become weak and brittle, making them easy to break',
   sentence:'Her doctor recommended calcium supplements to slow her osteoporosis.',zhSentence:'医生建议她服用钙片来减缓骨质疏松的进展。',mnemonic:'骨质疏松(gǔ zhì shū sōng) — 疏松 means "loose/porous." Osteo=bone, poro=porous. Porous bones',book:'anatomy',emoji:'🦴'},
  {id:100,level:3,word:'Cardiovascular',ipa:'/ˌkɑːdiəʊˈvæskjʊlər/',pos:'adj.',zh:'心血管的',def:'Relating to the heart and blood vessels',
   sentence:'Regular exercise is one of the best ways to improve cardiovascular health.',zhSentence:'定期锻炼是改善心血管健康的最佳方式之一。',mnemonic:'心血管(xīn xuè guǎn) — 心=heart, 血=blood, 管=vessel. Cardio=heart, vascular=vessels',book:'anatomy',emoji:'🏃'},
  {id:101,level:3,word:'Bladder',ipa:'/ˈblædər/',pos:'n.',zh:'膀胱',def:'The organ that stores urine until you are ready to urinate',
   sentence:'A bladder infection causes a burning sensation when urinating.',zhSentence:'膀胱感染会导致排尿时有灼热感。',mnemonic:'膀胱(páng guāng) — think "pang," the urgent feeling when your bladder is full',book:'anatomy',emoji:'💧'},
  {id:102,level:3,word:'Spleen',ipa:'/spliːn/',pos:'n.',zh:'脾脏',def:'An organ near the stomach that filters blood and helps fight infection',
   sentence:'A hard blow to the abdomen can rupture the spleen and cause internal bleeding.',zhSentence:'腹部受到重击可能导致脾脏破裂并引发内出血。',mnemonic:'脾(pí) — the spleen keeps blood clean, like a natural filter station',book:'anatomy',emoji:'🫀'},
  {id:103,level:3,word:'Appendix',ipa:'/əˈpendɪks/',pos:'n.',zh:'阑尾',def:'A small tube attached to the large intestine that can become infected',
   sentence:'He was rushed to the hospital when his appendix became inflamed.',zhSentence:'他的阑尾发炎，被紧急送往医院。',mnemonic:'阑尾(lán wěi) — 尾 means "tail," the appendix is like a little tail on your intestine',book:'anatomy',emoji:'☝️'},
  {id:104,level:3,word:'Capillary',ipa:'/ˈkæpɪləri/',pos:'n.',zh:'毛细血管',def:'The smallest blood vessels in the body, connecting arteries to veins',

  {id:105,level:3,word:'Meningitis',ipa:'/ˌmenɪnˈdʒaɪtɪs/',pos:'n.',zh:'脑膜炎',def:'A serious inflammation of the membranes surrounding the brain and spinal cord',
   sentence:'Stiff neck and high fever can be warning signs of meningitis.',zhSentence:'颈部僵硬和高烧可能是脑膜炎的警告信号。',mnemonic:'脑膜炎(nǎo mó yán) — 炎 means "inflammation." Menin=membrane, itis=inflammation',book:'anatomy',emoji:'🧠'},
  // ── CARDIOLOGY LEVEL 1 ───────────────────────────────────────────────────
  {id:106,level:1,word:'Heart attack',ipa:'/hɑːrt əˈtæk/',pos:'n.',zh:'心脏病发作',def:'Sudden blockage of blood supply to part of the heart',
   sentence:'Call emergency services immediately if you suspect a heart attack.',zhSentence:'如果怀疑心脏病发作，请立即拨打急救电话。',mnemonic:'心脏病发作(xīn zàng bìng fā zuò) — 发作 means "sudden attack." Heart under attack — call for help fast',book:'cardiology',emoji:'💔'},
  {id:107,level:1,word:'Blood pressure',ipa:'/blʌd ˈpreʃər/',pos:'n.',zh:'血压',def:'The force of blood pushing against the walls of your arteries',
   sentence:'A reading of 120/80 is considered normal blood pressure.',zhSentence:'120/80的读数被认为是正常血压。',mnemonic:'血压(xuè yā) — 血=blood, 压=pressure. Blood pressure: exactly what it says',book:'cardiology',emoji:'🩺'},
  {id:108,level:1,word:'Pulse',ipa:'/pʌls/',pos:'n.',zh:'脉搏',def:'The rhythmic beating felt in your wrist or neck as your heart pumps blood',
   sentence:'The paramedic checked his pulse to see if his heart was still beating.',zhSentence:'急救人员检查了他的脉搏，看心脏是否还在跳动。',mnemonic:'脉搏(mài bó) — 脉 means "pulse/vein." Feel the pulse, feel alive. 搏 sounds like "beat"',book:'cardiology',emoji:'💓'},
  {id:109,level:1,word:'Stroke',ipa:'/strəʊk/',pos:'n.',zh:'中风',def:'Brain damage caused by a blocked or burst blood vessel in the brain',
   sentence:'FAST — Face drooping, Arm weakness, Speech trouble — are signs of a stroke.',zhSentence:'面部下垂、手臂无力、言语障碍是中风的迹象，记住"FAST"。',mnemonic:'中风(zhòng fēng) — 中 means "hit," 风 means "wind." Act FAST: Face, Arms, Speech, Time',book:'cardiology',emoji:'🧠'},
  // ── CARDIOLOGY LEVEL 2 ───────────────────────────────────────────────────
  {id:110,level:2,word:'Arrhythmia',ipa:'/əˈrɪðmiə/',pos:'n.',zh:'心律失常',def:'An irregular heartbeat — too fast, too slow, or uneven',
   sentence:'She wore a heart monitor for two days to detect any arrhythmia.',zhSentence:'她佩戴了两天心脏监测仪来检测是否有心律失常。',mnemonic:'心律失常(xīn lǜ shī cháng) — 失常 means "abnormal." A = without, rhythmia = rhythm',book:'cardiology',emoji:'📉'},
  {id:111,level:2,word:'Angina',ipa:'/ænˈdʒaɪnə/',pos:'n.',zh:'心绞痛',def:'Chest pain or tightness caused by reduced blood flow to the heart muscle',

  {id:112,level:2,word:'Clot',ipa:'/klɒt/',pos:'n.',zh:'血栓',def:'A thick lump of hardened blood that can block blood vessels',
   sentence:'The doctor found a blood clot in her leg and started her on blood thinners.',zhSentence:'医生发现她腿部有血栓，并开始给她服用抗凝血药。',mnemonic:'血栓(xuè shuān) — 栓 means "plug/stopper." A clot CLOGS your vessels like a plug blocking a drain',book:'cardiology',emoji:'🔴'},
  {id:113,level:2,word:'Murmur',ipa:'/ˈmɜːmər/',pos:'n.',zh:'心脏杂音',def:'An unusual whooshing sound heard when a doctor listens to the heart',

  {id:114,level:2,word:'ECG',ipa:'/ˌiːsiːˈdʒiː/',pos:'n.',zh:'心电图',def:'A test that records the electrical activity of the heart using electrodes on the skin',
   sentence:'The ER doctor ordered an ECG to check if he was having a heart attack.',zhSentence:'急诊医生开了心电图检查，以确认他是否在心脏病发作。',mnemonic:'心电图(xīn diàn tú) — 电 means "electric," 图 means "picture." ECG = electric heart graph',book:'cardiology',emoji:'📊'},
  {id:115,level:2,word:'Stenosis',ipa:'/stɪˈnəʊsɪs/',pos:'n.',zh:'狭窄',def:'Abnormal narrowing of a blood vessel or heart valve that restricts blood flow',
   sentence:'He needed surgery to correct severe stenosis of the aortic valve.',zhSentence:'他需要手术来纠正严重的主动脉瓣狭窄。',mnemonic:'狭窄(xiá zhǎi) — both characters mean "narrow." Steno = narrow in Greek. Stenosis = narrowing condition',book:'cardiology',emoji:'🔧'},
  // ── CARDIOLOGY LEVEL 3 ───────────────────────────────────────────────────
  {id:116,level:3,word:'Myocardial infarction',ipa:'/ˌmaɪəˈkɑːdiəl ɪnˈfɑːkʃən/',pos:'n.',zh:'心肌梗死',def:'Medical term for a heart attack; death of heart muscle from blocked blood supply',
   sentence:'The patient was rushed to surgery following a myocardial infarction.',zhSentence:'患者在心肌梗死后被紧急送去手术。',mnemonic:'心肌梗死(xīn jī gěng sǐ) — 梗死 means "blockage death." Myo=muscle, cardial=heart, infarction=tissue death',book:'cardiology',emoji:'❤️‍🔥'},
  {id:117,level:3,word:'Atherosclerosis',ipa:'/ˌæθərəʊsklɪˈrəʊsɪs/',pos:'n.',zh:'动脉粥样硬化',def:'Build-up of fatty plaque inside artery walls that hardens them and reduces blood flow',
   sentence:'Years of a high-fat diet contributed to his atherosclerosis and stroke risk.',zhSentence:'多年的高脂饮食导致了他的动脉粥样硬化，增加了中风风险。',mnemonic:'动脉硬化(dòng mài yìng huà) — 硬化 means "hardening." Athero=porridge-like plaque, sclerosis=hardening',book:'cardiology',emoji:'🫙'},
  {id:118,level:3,word:'Aorta',ipa:'/eɪˈɔːtə/',pos:'n.',zh:'主动脉',def:'The largest artery in the body, carrying blood from the heart to the rest of the body',
   sentence:'An aneurysm in the aorta is life-threatening if it ruptures.',zhSentence:'主动脉瘤一旦破裂，危及生命。',mnemonic:'主动脉(zhǔ dòng mài) — 主 means "main/master." The aorta is the master highway of blood from the heart',book:'cardiology',emoji:'🛣️'},
  {id:119,level:3,word:'Pacemaker',ipa:'/ˈpeɪsmeɪkər/',pos:'n.',zh:'起搏器',def:'A small device implanted in the chest to help control an irregular or too-slow heartbeat',
   sentence:'After his arrhythmia diagnosis, surgeons implanted a pacemaker.',zhSentence:'心律失常确诊后，外科医生为他植入了起搏器。',mnemonic:'起搏器(qǐ bó qì) — 起搏 means "to pace/start beating." A pacemaker sets the pace — like a drummer keeping rhythm',book:'cardiology',emoji:'🔋'},
  {id:120,level:3,word:'Defibrillator',ipa:'/dɪˈfɪbrɪleɪtər/',pos:'n.',zh:'除颤器',def:'A device that delivers an electric shock to restore a normal heartbeat during cardiac arrest',
   sentence:'The staff used an AED defibrillator on the man who collapsed in the shopping mall.',zhSentence:'工作人员用AED除颤器对在商场晕倒的男子进行了急救。',mnemonic:'除颤(chú chàn) — 颤 means "trembling," 除 means "remove." De-fibrillator removes chaotic heart trembling',book:'cardiology',emoji:'⚡'},
  // ── CLINIC COMMUNICATION LEVEL 1 ─────────────────────────────────────────
  {id:121,level:1,word:'Appointment',ipa:'/əˈpɔɪntmənt/',pos:'n.',zh:'预约',def:'A scheduled time to see a doctor or healthcare provider',
   sentence:'She made an appointment with her doctor for next Tuesday at 10 a.m.',zhSentence:'她预约了下周二上午10点看医生。',mnemonic:'预约(yù yuē) — 预 means "in advance," 约 means "agreement." Making an appointment = agreeing in advance',book:'clinic',emoji:'📅'},
  {id:122,level:1,word:'Ambulance',ipa:'/ˈæmbjʊləns/',pos:'n.',zh:'救护车',def:'An emergency vehicle that transports sick or injured people to the hospital',
   sentence:'Someone called an ambulance when the man collapsed on the street.',zhSentence:'当那名男子在街上晕倒时，有人叫了救护车。',mnemonic:'救护车(jiù hù chē) — 救 means "rescue," 护 means "protect," 车 means "vehicle." Rescue-protect-vehicle',book:'clinic',emoji:'🚑'},
  {id:123,level:1,word:'Medical history',ipa:'/ˈmedɪkl ˈhɪstri/',pos:'n.',zh:'病史',def:'A record of a person\'s past illnesses, surgeries, medications, and health conditions',
   sentence:'Please fill out this form with your medical history before seeing the doctor.',zhSentence:'请在就诊前填写这张病史表格。',mnemonic:'病史(bìng shǐ) — 病 means "illness," 史 means "history." Your illness history — everything your body has been through',book:'clinic',emoji:'📋'},
  {id:124,level:1,word:'Vital signs',ipa:'/ˈvaɪtl saɪnz/',pos:'n.',zh:'生命体征',def:'Basic measurements showing how well your body is working: temperature, pulse, breathing, blood pressure',
   sentence:'The nurse checked his vital signs every four hours throughout the night.',zhSentence:'护士整晚每四小时检查一次他的生命体征。',mnemonic:'生命体征(shēng mìng tǐ zhēng) — 生命 means "life." Vital signs are the signs of life',book:'clinic',emoji:'📟'},
  {id:125,level:1,word:'X-ray',ipa:'/ˈeks reɪ/',pos:'n.',zh:'X光',def:'A type of imaging that uses radiation to take pictures of bones inside the body',
   sentence:'The doctor ordered an X-ray to check if her wrist was fractured.',zhSentence:'医生开了X光检查，以确认她的手腕是否骨折。',mnemonic:'X光(X guāng) — 光 means "light." X-rays are mysterious light that sees right through you',book:'clinic',emoji:'🩻'},
  // ── CLINIC COMMUNICATION LEVEL 2 ─────────────────────────────────────────
  {id:126,level:2,word:'Ultrasound',ipa:'/ˈʌltrəsaʊnd/',pos:'n.',zh:'超声波检查',def:'An imaging test using sound waves to see pictures of organs inside the body',
   sentence:'The pregnant woman had an ultrasound to check her baby\'s development.',zhSentence:'孕妇做了超声波检查来了解宝宝的发育情况。',mnemonic:'超声波(chāo shēng bō) — 超 means "ultra/beyond," 声 means "sound." Ultra-sound: beyond hearing, seeing inside',book:'clinic',emoji:'🔊'},
  {id:127,level:2,word:'CT scan',ipa:'/ˌsiːˈtiː skæn/',pos:'n.',zh:'CT扫描',def:'Detailed X-ray that takes cross-section images of the body from many angles',
   sentence:'The CT scan revealed a small tumor near his kidney.',zhSentence:'CT扫描发现他肾脏附近有一个小肿瘤。',mnemonic:'CT = Computed Tomography. 扫描(sǎo miáo) means "scan." CT cuts your body into picture slices — without cutting',book:'clinic',emoji:'🖥️'},
  {id:128,level:2,word:'MRI',ipa:'/ˌemɑːrˈaɪ/',pos:'n.',zh:'核磁共振',def:'A scan using magnetic fields to create detailed images of soft tissues and organs',
   sentence:'She needed an MRI to check for damage to the ligaments in her knee.',zhSentence:'她需要做核磁共振来检查膝盖韧带是否受损。',mnemonic:'MRI = Magnetic Resonance Imaging. It uses magnetism to make body atoms "resonate" and form images',book:'clinic',emoji:'🧲'},
  {id:129,level:2,word:'Inpatient',ipa:'/ˈɪnpeɪʃənt/',pos:'n.',zh:'住院患者',def:'A patient admitted to the hospital who stays overnight or longer for treatment',
   sentence:'After surgery, she became an inpatient and stayed in hospital for three days.',zhSentence:'手术后，她成为住院患者，在医院住了三天。',mnemonic:'住院(zhù yuàn) — 住 means "to stay/reside." Inpatient = staying IN the hospital',book:'clinic',emoji:'🛏️'},
  {id:130,level:2,word:'Outpatient',ipa:'/ˈaʊtpeɪʃənt/',pos:'n.',zh:'门诊患者',def:'A patient who receives treatment without being admitted overnight',
   sentence:'The procedure was minor enough to be done on an outpatient basis, so he went home the same day.',zhSentence:'这个手术可以作为门诊手术进行，他当天就回家了。',mnemonic:'门诊(mén zhěn) — 门 means "door." Outpatient comes in through the door and goes back out same day',book:'clinic',emoji:'🚶'},
  {id:131,level:2,word:'Triage',ipa:'/ˈtriːɑːʒ/',pos:'n.',zh:'分诊',def:'Sorting patients by urgency so the most critical are treated first',
   sentence:'In the busy emergency room, the nurse performed triage on every arriving patient.',zhSentence:'在繁忙的急诊室，护士对每位到来的患者进行分诊。',mnemonic:'分诊(fēn zhěn) — 分 means "to sort/divide." Triage = sorting patients by urgency. French "trier" = to sort',book:'clinic',emoji:'🚦'},
  {id:132,level:2,word:'Prognosis',ipa:'/prɒɡˈnəʊsɪs/',pos:'n.',zh:'预后',def:'A prediction about the likely course and outcome of a disease',
   sentence:'The oncologist gave her a positive prognosis after the tumor was completely removed.',zhSentence:'肿瘤被完全切除后，肿瘤科医生给出了积极的预后评估。',mnemonic:'预后(yù hòu) — 预 means "predict," 后 means "after/future." Pro = before, gnosis = knowledge',book:'clinic',emoji:'🔮'},
  // ── CLINIC COMMUNICATION LEVEL 3 ─────────────────────────────────────────
  {id:133,level:3,word:'Anesthesia',ipa:'/ˌænɪsˈθiːziə/',pos:'n.',zh:'麻醉',def:'Medicine used to block pain or make a patient unconscious during surgery',
   sentence:'She was under general anesthesia for the entire four-hour surgery.',zhSentence:'她在整个四小时的手术过程中都处于全身麻醉状态。',mnemonic:'麻醉(má zuì) — 麻 means "numb," 醉 means "unconscious." An = without, esthesia = feeling',book:'clinic',emoji:'💤'},
  {id:134,level:3,word:'Ventilator',ipa:'/ˈventɪleɪtər/',pos:'n.',zh:'呼吸机',def:'A machine that helps or takes over breathing for patients who cannot breathe on their own',
   sentence:'The critically ill patient was placed on a ventilator in the ICU.',zhSentence:'这名危重患者在重症监护室被接上了呼吸机。',mnemonic:'呼吸机(hū xī jī) — 呼吸 means "breathe," 机 means "machine." Breathing machine: simple and direct',book:'clinic',emoji:'💨'},
  {id:135,level:3,word:'Incision',ipa:'/ɪnˈsɪʒən/',pos:'n.',zh:'切口',def:'A surgical cut made in the body during an operation',
   sentence:'The surgeon made a small incision in his abdomen to remove the appendix.',zhSentence:'外科医生在他腹部做了一个小切口来切除阑尾。',mnemonic:'切口(qiē kǒu) — 切 means "to cut," 口 means "opening." An incision is a cut-opening in the body',book:'clinic',emoji:'🔪'},
  {id:136,level:3,word:'Contraindication',ipa:'/ˌkɒntrəˌɪndɪˈkeɪʃən/',pos:'n.',zh:'禁忌症',def:'A reason why a particular treatment or drug should NOT be used because it could be harmful',
   sentence:'Pregnancy is a contraindication for many medications that could harm the baby.',zhSentence:'妊娠是许多可能伤害胎儿药物的禁忌症。',mnemonic:'禁忌(jìn jì) means "forbidden/taboo." Contra = against, indication = recommendation. A red flag warning',book:'clinic',emoji:'🚫'},
  // ── PHARMACOLOGY LEVEL 1 ────────────────────────────────────────────────
  {id:137,level:1,word:'Tablet',ipa:'/ˈtæblɪt/',pos:'n.',zh:'药片',def:'A solid, flat pill containing medicine that you swallow',
   sentence:'Take one tablet with water after each meal.',zhSentence:'每餐后用水服一片药片。',mnemonic:'药片(yào piàn) — 片 means "flat piece/slice." A tablet is a little flat piece of medicine',book:'pharma',emoji:'⬜'},
  {id:138,level:1,word:'Capsule',ipa:'/ˈkæpsjuːl/',pos:'n.',zh:'胶囊',def:'A small gelatin container holding powdered or liquid medicine inside',
   sentence:'The antibiotic comes in capsule form — swallow it whole, do not chew it.',zhSentence:'这种抗生素是胶囊剂型——整颗吞服，不要咀嚼。',mnemonic:'胶囊(jiāo náng) — 胶 means "gelatin," 囊 means "pouch/sac." A gelatin pouch of medicine',book:'pharma',emoji:'💊'},
  {id:139,level:1,word:'Syrup',ipa:'/ˈsɪrəp/',pos:'n.',zh:'糖浆',def:'A thick sweet liquid medicine, often given to children',
   sentence:'The pediatrician prescribed a cherry-flavored syrup for her cough.',zhSentence:'儿科医生给她开了樱桃味止咳糖浆。',mnemonic:'糖浆(táng jiāng) — 糖 means "sugar," 浆 means "thick liquid." Sugar-liquid = sweet medicine',book:'pharma',emoji:'🍯'},
  {id:140,level:1,word:'Cream',ipa:'/kriːm/',pos:'n.',zh:'药膏',def:'A thick smooth substance applied to the skin to treat rashes, pain, or infections',
   sentence:'Apply this antifungal cream to the affected area twice a day.',zhSentence:'每天两次将这种抗真菌药膏涂在患处。',mnemonic:'药膏(yào gāo) — 膏 means "paste/ointment." Drug-paste = medicated cream applied to skin',book:'pharma',emoji:'🧴'},
  {id:141,level:1,word:'Pharmacist',ipa:'/ˈfɑːməsɪst/',pos:'n.',zh:'药剂师',def:'A trained professional who prepares and dispenses medications',
   sentence:'The pharmacist explained how to take the new medication and warned about side effects.',zhSentence:'药剂师解释了如何服用新药，并提醒了副作用。',mnemonic:'药剂师(yào jì shī) — 师 means "master," 药剂 means "medicine preparation." A master of medicines',book:'pharma',emoji:'👨‍⚕️'},
  {id:142,level:1,word:'Refill',ipa:'/ˈriːfɪl/',pos:'n.',zh:'续药',def:'Getting a new supply of a prescription medicine when your previous supply runs out',
   sentence:'She called the pharmacy to request a refill for her blood pressure medication.',zhSentence:'她打电话给药店要求续开她的血压药。',mnemonic:'续药(xù yào) — 续 means "to continue/renew." A refill re-fills your prescription to continue treatment',book:'pharma',emoji:'🔄'},
  // ── PHARMACOLOGY LEVEL 2 ────────────────────────────────────────────────
  {id:143,level:2,word:'Antihistamine',ipa:'/ˌæntiˈhɪstəmiːn/',pos:'n.',zh:'抗组胺药',def:'Medicine that reduces allergy symptoms like sneezing, itching, and runny nose',
   sentence:'She took an antihistamine before going outside during allergy season.',zhSentence:'过敏季节外出前，她服用了抗组胺药。',mnemonic:'抗组胺(kàng zǔ àn) — 抗 means "anti/fight." Anti + histamine: fights histamine, the allergy chemical',book:'pharma',emoji:'🤧'},
  {id:144,level:2,word:'Antacid',ipa:'/ˌænˈtæsɪd/',pos:'n.',zh:'抗酸药',def:'Medicine that neutralizes stomach acid to relieve heartburn or indigestion',
   sentence:'He chewed an antacid tablet after the spicy meal to calm his heartburn.',zhSentence:'吃了辛辣食物后，他嚼了一片抗酸药来缓解烧心。',mnemonic:'抗酸(kàng suān) — 抗 = anti, 酸 = acid/sour. Antacid = anti + acid. Fights stomach acid',book:'pharma',emoji:'🫙'},
  {id:145,level:2,word:'Laxative',ipa:'/ˈlæksətɪv/',pos:'n.',zh:'泻药',def:'Medicine that helps relieve constipation by stimulating bowel movements',
   sentence:'The doctor recommended a mild laxative after surgery since pain medication caused constipation.',zhSentence:'由于止痛药引起便秘，医生建议术后服用温和的泻药。',mnemonic:'泻药(xiè yào) — 泻 means "to purge/drain." Lax = loose/relaxed. A laxative relaxes the bowel',book:'pharma',emoji:'💧'},
  {id:146,level:2,word:'Diuretic',ipa:'/ˌdaɪjʊˈretɪk/',pos:'n.',zh:'利尿剂',def:'Medicine that increases urine production to remove excess fluid from the body',
   sentence:'Her doctor prescribed a diuretic to reduce the swelling in her ankles.',zhSentence:'医生开了利尿剂来消除她踝部的肿胀。',mnemonic:'利尿(lì niào) — 利 means "to promote," 尿 means "urine." Promotes urination. Dia + urine = makes you urinate more',book:'pharma',emoji:'💦'},
  {id:147,level:2,word:'Steroid',ipa:'/ˈstɪərɔɪd/',pos:'n.',zh:'类固醇',def:'A powerful anti-inflammatory medicine used to treat many conditions',
   sentence:'The doctor prescribed a short course of steroids to reduce the severe inflammation.',zhSentence:'医生开了短疗程类固醇药物来减轻严重炎症。',mnemonic:'类固醇(lèi gù chún) — 类 means "type/class." Steroids are a class of powerful compounds. Use carefully',book:'pharma',emoji:'💪'},
  {id:148,level:2,word:'Blood thinner',ipa:'/blʌd ˈθɪnər/',pos:'n.',zh:'抗凝血药',def:'Medicine that prevents blood clots from forming or getting bigger',
   sentence:'Patients with artificial heart valves often need to take a blood thinner daily.',zhSentence:'安装人工心脏瓣膜的患者通常需要每天服用抗凝血药。',mnemonic:'抗凝血(kàng níng xuè) — 凝 means "to congeal/clot." Anti-clotting medicine keeps blood flowing freely',book:'pharma',emoji:'🩸'},
  {id:149,level:2,word:'Generic drug',ipa:'/dʒɪˈnerɪk drʌɡ/',pos:'n.',zh:'仿制药',def:'A copy of a brand-name drug with the same active ingredients but at a lower price',
   sentence:'The pharmacist suggested switching to the generic drug to save money.',zhSentence:'药剂师建议改用仿制药来节省费用。',mnemonic:'仿制药(fǎng zhì yào) — 仿 means "imitate/copy." Generic = general/non-branded version of a drug',book:'pharma',emoji:'💰'},
  // ── PHARMACOLOGY LEVEL 3 ────────────────────────────────────────────────
  {id:150,level:3,word:'Drug interaction',ipa:'/drʌɡ ˌɪntərˈækʃən/',pos:'n.',zh:'药物相互作用',def:'When two or more drugs affect each other, sometimes dangerously',
   sentence:'Always tell your pharmacist all the medications you take to avoid dangerous drug interactions.',zhSentence:'务必告诉药剂师你服用的所有药物，以避免危险的药物相互作用。',mnemonic:'药物相互作用(yào wù xiāng hù zuò yòng) — 相互 means "mutual." Two drugs acting on each other',book:'pharma',emoji:'⚠️'},
  {id:151,level:3,word:'Placebo',ipa:'/pləˈsiːbəʊ/',pos:'n.',zh:'安慰剂',def:'A harmless pill with no active medicine, used in clinical trials as a comparison',
   sentence:'In the clinical trial, half the patients received the real drug and half received a placebo.',zhSentence:'在临床试验中，一半患者服用了真正的药物，另一半服用了安慰剂。',mnemonic:'安慰剂(ān wèi jì) — 安慰 means "comfort/console." Placebo = Latin for "I will please." No real medicine',book:'pharma',emoji:'🍬'},
  {id:152,level:3,word:'Half-life',ipa:'/hɑːf laɪf/',pos:'n.',zh:'半衰期',def:'The time it takes for the amount of a drug in the body to reduce by half',
   sentence:'A drug with a long half-life stays active in the body for many hours or days.',zhSentence:'半衰期长的药物在体内可以保持活性数小时甚至数天。',mnemonic:'半衰期(bàn shuāi qī) — 半 means "half," 衰 means "decline," 期 means "period." Half-decline-period',book:'pharma',emoji:'⏳'},
  // ── ANATOMY LEVEL 1 ADDITIONS ────────────────────────────────────────────
  {id:153,level:1,word:'Ear',ipa:'/ɪər/',pos:'n.',zh:'耳朵',def:'The organ on the sides of your head that you use to hear sounds',
   sentence:'The doctor looked inside her ear to check for an infection.',zhSentence:'医生查看了她的耳朵，检查是否有感染。',mnemonic:'耳(ěr) — the character 耳 looks like an ear: a rectangle with lines, perfect for the hearing organ',book:'anatomy',emoji:'👂'},
  {id:154,level:1,word:'Eye',ipa:'/aɪ/',pos:'n.',zh:'眼睛',def:'The organ in your face that you use to see',
   sentence:'She wore glasses to correct her blurry eyesight.',zhSentence:'她戴眼镜来矫正模糊的视力。',mnemonic:'眼(yǎn) contains 目 (eye). 目 itself looks like an eye viewed from the front — two horizontal lines inside a rectangle',book:'anatomy',emoji:'👁️'},
  {id:155,level:1,word:'Nose',ipa:'/nəʊz/',pos:'n.',zh:'鼻子',def:'The part of your face above your mouth that you use to breathe and smell',
   sentence:'She blew her nose into a tissue after the cold.',zhSentence:'感冒后她用纸巾擤了擤鼻子。',mnemonic:'鼻(bí) contains 自 (self) at the top. In Chinese, 自 means self — your nose points at yourself, center of your face',book:'anatomy',emoji:'👃'},
  {id:156,level:1,word:'Tongue',ipa:'/tʌŋ/',pos:'n.',zh:'舌头',def:'The soft, movable organ inside your mouth used for tasting, chewing, and speaking',
   sentence:'She burnt her tongue on the hot soup.',zhSentence:'她被热汤烫伤了舌头。',mnemonic:'舌(shé) — something that comes out of the mouth (口). The tongue flicks out to taste things',book:'anatomy',emoji:'👅'},
  {id:157,level:1,word:'Jaw',ipa:'/dʒɔː/',pos:'n.',zh:'下颌',def:'The lower bone of your face that holds your lower teeth and moves when you eat or talk',
   sentence:'He had jaw pain after the dentist appointment.',zhSentence:'牙医检查后他感到下颌疼痛。',mnemonic:'下颌(xià hé) — 下 means "lower." The jaw is the lower part of your face that moves up and down',book:'anatomy',emoji:'🦷'},
  {id:158,level:1,word:'Chest',ipa:'/tʃest/',pos:'n.',zh:'胸部',def:'The front part of your body between your neck and your stomach, enclosing the heart and lungs',
   sentence:'He felt a tightness in his chest and went to see a doctor.',zhSentence:'他感到胸部发紧，于是去看了医生。',mnemonic:'胸(xiōng) — the chest houses your most vital organs: heart and lungs. Think "X marks the chest" on a treasure map',book:'anatomy',emoji:'🫁'},
  // ── ANATOMY LEVEL 2 ADDITIONS ────────────────────────────────────────────
  {id:159,level:2,word:'Cornea',ipa:'/ˈkɔːniə/',pos:'n.',zh:'角膜',def:'The clear, dome-shaped surface at the front of the eye that focuses incoming light',
   sentence:'She needed corneal surgery to correct her severe vision problem.',zhSentence:'她需要角膜手术来矫正严重的视力问题。',mnemonic:'角膜(jiǎo mó) — 角 means "horn/corner." The cornea is the clear curved window at the front of your eye',book:'anatomy',emoji:'👁️'},
  {id:160,level:2,word:'Eardrum',ipa:'/ˈɪərdrʌm/',pos:'n.',zh:'鼓膜',def:'A thin membrane inside the ear that vibrates with sound and sends signals to the brain',
   sentence:'Listening to loud music can damage your eardrum over time.',zhSentence:'长时间听高音量音乐会损伤鼓膜。',mnemonic:'鼓膜(gǔ mó) — 鼓 means "drum." The eardrum is literally a tiny drum in your ear that vibrates with sound',book:'anatomy',emoji:'🥁'},
  {id:161,level:2,word:'Tonsil',ipa:'/ˈtɒnsl/',pos:'n.',zh:'扁桃体',def:'One of two small oval masses of tissue at the back of the throat that help fight infection',

  {id:162,level:2,word:'Clavicle',ipa:'/ˈklævɪkl/',pos:'n.',zh:'锁骨',def:'The collarbone; the horizontal bone connecting the shoulder to the breastbone',
   sentence:'She fractured her clavicle when she fell off her bicycle.',zhSentence:'她从自行车上摔下来，锁骨骨折了。',mnemonic:'锁骨(suǒ gǔ) — 锁 means "lock." The clavicle locks your arm to your body at the shoulder',book:'anatomy',emoji:'🔑'},
  {id:163,level:2,word:'Rib',ipa:'/rɪb/',pos:'n.',zh:'肋骨',def:'One of the curved bones that form a protective cage around your chest organs',
   sentence:'He cracked two ribs in the car accident.',zhSentence:'他在车祸中肋骨骨折了。',mnemonic:'肋骨(lèi gǔ) — 肋 contains 月(flesh), a body part indicator. Ribs cage your heart and lungs like armor',book:'anatomy',emoji:'🦴'},
  {id:164,level:2,word:'Femur',ipa:'/ˈfiːmər/',pos:'n.',zh:'股骨',def:'The thigh bone; the longest and strongest bone in the body, from the hip to the knee',
   sentence:'A broken femur usually requires surgery and months of recovery.',zhSentence:'股骨骨折通常需要手术和数月康复。',mnemonic:'股骨(gǔ gǔ) — 股 means "thigh." The femur is the longest single bone in your body, in your thigh',book:'anatomy',emoji:'🦴'},
  {id:165,level:2,word:'Trachea',ipa:'/trəˈkiːə/',pos:'n.',zh:'气管',def:'The windpipe; the tube connecting your throat to your lungs that carries air',
   sentence:'Food going down the wrong pipe blocks the trachea and causes choking.',zhSentence:'食物进入气管会导致窒息。',mnemonic:'气管(qì guǎn) — 气=air, 管=tube. Trachea = air-tube: the pipe that carries air down to your lungs',book:'anatomy',emoji:'🌬️'},
  {id:166,level:2,word:'Retina',ipa:'/ˈretɪnə/',pos:'n.',zh:'视网膜',def:'The light-sensitive layer at the back of the eye that converts images into nerve signals',
   sentence:'Diabetes can damage the retina and lead to blindness if untreated.',zhSentence:'糖尿病若不治疗，可能损伤视网膜导致失明。',mnemonic:'视网膜(shì wǎng mó) — 视=vision, 网=net, 膜=membrane. The retina is a visual "net" at the back of the eye',book:'anatomy',emoji:'📸'},
  // ── ANATOMY LEVEL 3 ADDITIONS ────────────────────────────────────────────
  {id:167,level:3,word:'Adrenal gland',ipa:'/əˈdriːnəl ɡlænd/',pos:'n.',zh:'肾上腺',def:'Two small glands on top of the kidneys that produce hormones including adrenaline',
   sentence:'Stress triggers the adrenal glands to release hormones that speed up your heart rate.',zhSentence:'压力会触发肾上腺释放激素，加快心跳。',mnemonic:'肾上腺(shèn shàng xiàn) — 肾=kidney, 上=above. Ad(near)+renal(kidney). Glands sitting above your kidneys',book:'anatomy',emoji:'⚡'},
  {id:168,level:3,word:'Alveoli',ipa:'/ælˈviːəlaɪ/',pos:'n.',zh:'肺泡',def:'Tiny air sacs at the end of the airways in the lungs where oxygen enters the blood',
   sentence:'Smoking destroys alveoli, reducing the lungs\' ability to absorb oxygen.',zhSentence:'吸烟会破坏肺泡，降低肺部吸收氧气的能力。',mnemonic:'肺泡(fèi pào) — 泡 means "bubble/sac." Alveoli are tiny bubble-sacs where oxygen and carbon dioxide are exchanged',book:'anatomy',emoji:'🫧'},
  {id:169,level:3,word:'Cerebellum',ipa:'/ˌserɪˈbeləm/',pos:'n.',zh:'小脑',def:'The part of the brain at the back of the skull that controls balance, coordination, and movement',
   sentence:'Damage to the cerebellum can cause difficulty with balance and coordinated movement.',zhSentence:'小脑损伤会导致平衡和协调运动困难。',mnemonic:'小脑(xiǎo nǎo) — 小=small. Cerebellum = Latin for "little brain." The small brain at the back that keeps you balanced',book:'anatomy',emoji:'🎯'},
  {id:170,level:3,word:'Pituitary gland',ipa:'/pɪˈtjuːɪteri ɡlænd/',pos:'n.',zh:'垂体',def:'A pea-sized gland at the base of the brain that controls many other hormone glands',
   sentence:'A tumor on the pituitary gland can disrupt hormone balance throughout the body.',zhSentence:'垂体上的肿瘤会扰乱全身激素平衡。',mnemonic:'垂体(chuí tǐ) — 垂 means "hanging down." The pituitary hangs below the brain, controlling all other glands like a master switch',book:'anatomy',emoji:'👑'},
  {id:171,level:3,word:'Bronchus',ipa:'/ˈbrɒŋkəs/',pos:'n.',zh:'支气管',def:'One of the two main airways that branch from the trachea and carry air into the lungs',
   sentence:'Asthma causes the bronchi to narrow, making breathing difficult.',zhSentence:'哮喘导致支气管变窄，使呼吸困难。',mnemonic:'支气管(zhī qì guǎn) — 支=branch, 气=air, 管=tube. Branching air-tubes that go from the windpipe into the lungs',book:'anatomy',emoji:'🌿'},
  // ── CARDIOLOGY ADDITIONS ─────────────────────────────────────────────────
  {id:172,level:1,word:'Heart rate',ipa:'/hɑːrt reɪt/',pos:'n.',zh:'心率',def:'The number of times your heart beats per minute',
   sentence:'A normal resting heart rate for adults is between 60 and 100 beats per minute.',zhSentence:'成年人正常静息心率为每分钟60至100次。',mnemonic:'心率(xīn lǜ) — 心=heart, 率=rate. Heart rate tells how fast your heart is working at any moment',book:'cardiology',emoji:'💓'},
  {id:173,level:1,word:'Valve',ipa:'/vælv/',pos:'n.',zh:'心脏瓣膜',def:'A flap of tissue in the heart that keeps blood flowing in one direction only',
   sentence:'A damaged heart valve may need to be repaired or replaced with surgery.',zhSentence:'损坏的心脏瓣膜可能需要手术修复或更换。',mnemonic:'瓣膜(bàn mó) — 瓣 means "petal/flap." Heart valves are like petals that open and close to direct blood flow',book:'cardiology',emoji:'🚪'},
  {id:174,level:1,word:'Ventricle',ipa:'/ˈventrɪkl/',pos:'n.',zh:'心室',def:'One of the two lower chambers of the heart that pump blood out to the lungs and body',
   sentence:'The left ventricle is the most powerful chamber, pumping blood to the entire body.',zhSentence:'左心室是最强有力的腔室，将血液泵送到全身。',mnemonic:'心室(xīn shì) — 室=room/chamber. Ventricle = Latin for "little belly." The lower pumping rooms of the heart',book:'cardiology',emoji:'🏠'},
  {id:175,level:1,word:'Atrium',ipa:'/ˈeɪtriəm/',pos:'n.',zh:'心房',def:'One of the two upper chambers of the heart that receive blood coming in',
   sentence:'Blood flows from the right atrium into the right ventricle before going to the lungs.',zhSentence:'血液从右心房流入右心室，然后流向肺部。',mnemonic:'心房(xīn fáng) — 房 also means "room." The atria are the upper receiving rooms of the heart',book:'cardiology',emoji:'🏛️'},
  {id:176,level:2,word:'Aneurysm',ipa:'/ˈænjʊrɪzəm/',pos:'n.',zh:'动脉瘤',def:'A dangerous bulge or balloon-like swelling in the wall of a blood vessel that can rupture',
   sentence:'She was rushed into emergency surgery when her brain aneurysm ruptured.',zhSentence:'脑动脉瘤破裂后，她被紧急送去手术。',mnemonic:'动脉瘤(dòng mài liú) — 瘤=lump/growth. An aneurysm is a dangerous bulging lump in a blood vessel wall',book:'cardiology',emoji:'💥'},
  {id:177,level:2,word:'Embolism',ipa:'/ˈembəlɪzəm/',pos:'n.',zh:'栓塞',def:'A sudden blockage in a blood vessel caused by a clot or material that has traveled through the blood',
   sentence:'She developed a pulmonary embolism — a dangerous blood clot lodged in her lung.',zhSentence:'她患上了肺栓塞——一种危险的肺部血凝块。',mnemonic:'栓塞(shuān sè) — 栓=stopper, 塞=plug. An embolism plugs up a vessel like a cork suddenly blocking a pipe',book:'cardiology',emoji:'🚧'},
  {id:178,level:2,word:'Heart failure',ipa:'/hɑːrt ˈfeɪljər/',pos:'n.',zh:'心力衰竭',def:'A condition where the heart cannot pump blood effectively enough to meet the body\'s needs',
   sentence:'She was admitted to hospital for acute heart failure and put on oxygen.',zhSentence:'她因急性心力衰竭入院并接受氧气治疗。',mnemonic:'心力衰竭(xīn lì shuāi jié) — 衰竭 means "exhausted/failing." The heart loses the strength to pump effectively',book:'cardiology',emoji:'💔'},
  {id:179,level:2,word:'Cardiomyopathy',ipa:'/ˌkɑːdiəʊmaɪˈɒpəθi/',pos:'n.',zh:'心肌病',def:'Disease of the heart muscle that makes it harder for the heart to pump blood properly',
   sentence:'His cardiomyopathy was diagnosed after he fainted during exercise.',zhSentence:'他在运动中晕倒后被诊断为心肌病。',mnemonic:'心肌病(xīn jī bìng) — 心=heart, 肌=muscle, 病=disease. Cardio=heart, myo=muscle, pathy=disease',book:'cardiology',emoji:'🫀'},
  {id:180,level:3,word:'Angioplasty',ipa:'/ˈændʒiəʊplæsti/',pos:'n.',zh:'血管成形术',def:'A procedure to widen narrowed or blocked arteries, usually using a small inflatable balloon',
   sentence:'He had a coronary angioplasty to open the blocked artery in his heart.',zhSentence:'他接受了冠状动脉血管成形术来疏通心脏中堵塞的动脉。',mnemonic:'血管成形术(xuè guǎn chéng xíng shù) — Angio=vessel, plasty=reshaping. Widening a narrowed vessel to restore blood flow',book:'cardiology',emoji:'🎈'},
  {id:181,level:3,word:'Cardiac arrest',ipa:'/ˈkɑːdiæk əˈrest/',pos:'n.',zh:'心脏骤停',def:'When the heart suddenly stops beating; requires immediate CPR and defibrillation to survive',
   sentence:'He went into cardiac arrest and was saved by a bystander who performed CPR.',zhSentence:'他心脏骤停，被旁观者做CPR救了回来。',mnemonic:'心脏骤停(xīn zàng zhòu tíng) — 骤停=sudden stop. The heart\'s electrical system fails and it stops completely. Call for help fast',book:'cardiology',emoji:'⛔'},
  {id:182,level:3,word:'Echocardiogram',ipa:'/ˌekəʊˈkɑːdiəɡræm/',pos:'n.',zh:'超声心动图',def:'An ultrasound of the heart that shows its structure and how well it is pumping',
   sentence:'The echocardiogram showed that his heart valves were working normally.',zhSentence:'超声心动图显示他的心脏瓣膜功能正常。',mnemonic:'超声心动图(chāo shēng xīn dòng tú) — Echo=sound waves, cardio=heart, gram=image. Sound waves create a live picture of the beating heart',book:'cardiology',emoji:'🔊'},
  // ── CLINIC COMMUNICATION ADDITIONS ──────────────────────────────────────
  {id:183,level:1,word:'Checkup',ipa:'/ˈtʃekʌp/',pos:'n.',zh:'体检',def:'A routine medical examination to assess your overall health',
   sentence:'She went in for her annual checkup and got a clean bill of health.',zhSentence:'她去做了年度体检，健康状况良好。',mnemonic:'体检(tǐ jiǎn) — 体=body, 检=check. A checkup is literally a full body check',book:'clinic',emoji:'✅'},
  {id:184,level:1,word:'Ward',ipa:'/wɔːd/',pos:'n.',zh:'病房',def:'A room or section in a hospital where patients stay during treatment',

function go(sc){S.screen=sc;S.cardFlipped=false;render()}
function currentVocab(){return S.currentBook?VOCAB.filter(x=>x.book===S.currentBook):VOCAB;}

function applyAccent(key){
  const c=ACCENT_COLORS[key];const r=document.documentElement.style;
  r.setProperty('--accent',c.main);r.setProperty('--mint',c.main);
  r.setProperty('--mint-600',c.d600);r.setProperty('--mint-700',c.d700);
  r.setProperty('--mint-50',c.l50);r.setProperty('--mint-100',c.l100);
  r.setProperty('--sh-mint',`0 8px 24px ${c.main}4D,0 2px 6px ${c.d600}33`);
  S.accent=key;
}

function getQuizQ(){
  const qi=S.quizIdx%VOCAB.length;
  if(S.quizOptionsFor!==qi||!S.quizOptions){
    const v=VOCAB[qi];
    const wrong=VOCAB.filter(x=>x.id!==v.id).sort(()=>.5-Math.random()).slice(0,3).map(x=>x.def);
    const opts=[v.def,...wrong].sort(()=>.5-Math.random());
    S.quizOptions=opts;S.quizCorrect=opts.indexOf(v.def);S.quizOptionsFor=qi;
  }
  return {v:VOCAB[qi],opts:S.quizOptions,correct:S.quizCorrect};
}

function doctorSentence(){
  if(!S.doctorSelected.size)return null;
  const syms=Array.from(S.doctorSelected);
  const pl=BODY_PARTS[S.doctorPart].label.toLowerCase();
  const pzh=BODY_PARTS[S.doctorPart].zh;
  const list=syms.length===1?syms[0]:syms.slice(0,-1).join(', ')+' and '+syms[syms.length-1];
  return{
    en:`I've been having ${list} in my ${pl} for ${S.doctorDuration}.`,
    zh:`我在${pzh}有${syms.map(s=>ZH_SYM[s]||s).join('、')}，已经持续了${S.doctorDuration}。`
  };
}

/* ── SRS / localStorage helpers ─────────────────────────────────────────── */
const STAGE_MS=[60000,600000,3600000,28800000,86400000,259200000,604800000,1209600000];
function loadRD(){try{return JSON.parse(localStorage.getItem('mp_rv')||'{}');}catch{return{};}}
function saveRD(d){try{localStorage.setItem('mp_rv',JSON.stringify(d));}catch{}}
function loadCV(){try{return JSON.parse(localStorage.getItem('mp_cv')||'[]');}catch{return[];}}
function saveCV(v){try{localStorage.setItem('mp_cv',JSON.stringify(v));}catch{}}
function allVocab(){return[...VOCAB,...loadCV()];}
function markWord(id,know){
  const rd=loadRD();
  const cur=rd[id]||{stage:0};
  const ns=know?Math.min(cur.stage+1,STAGE_MS.length-1):0;
  rd[id]={stage:ns,nextDue:Date.now()+STAGE_MS[ns]};
  saveRD(rd);
}
function startReview(words){
  S.reviewSession=words.map(w=>w.id);
  S.reviewIdx=0;S.reviewFlipped=false;S.reviewDone=false;S.reviewKnow=0;
}

  // ── Session complete ──────────────────────────────────────────────────────
  if(S.reviewDone&&S.reviewSession.length){
    const total=S.reviewSession.length,known=S.reviewKnow;
    return`<div class="screen" style="background:var(--beige)">
      ${sbar()}

  // ── List view ─────────────────────────────────────────────────────────────
  const rd=loadRD();const now=Date.now();
  const av=allVocab();
  const due=av.filter(w=>{const d=rd[w.id];return d&&d.nextDue<=now;});
  const upcoming=av.filter(w=>{const d=rd[w.id];return d&&d.nextDue>now;}).slice(0,5);

          <path d="${path} L${W},${H} L0,${H} Z" fill="url(#cg)"/>
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
          ${ys.map((y,i)=>`<circle cx="${i*(W/7)}" cy="${y}" r="3.5" fill="var(--accent)"/>`).join('')}

        <div style="display:flex;justify-content:space-between;margin-top:5px">

              </div>
            </div>`).join('')
          :`<div class="card" style="padding:20px;text-align:center;margin-bottom:8px">
              <p style="font-size:28px;margin-bottom:8px">🔍</p>
              <p style="font-size:14px;font-weight:600;color:var(--ink-2)">Not found in vocabulary</p>
              <p style="font-size:12px;color:var(--ink-4);margin-top:4px">未找到 · Add it as a custom word below</p>
            </div>`
        }`
      :`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">
          ${['All','anatomy','cardiology','clinic','pharma'].map(b=>{
            const count=b==='All'?av.length:av.filter(x=>x.book===b).length;
            const bk=BOOKS.find(x=>x.id===b);
            const col=bk?bk.color:'var(--ink-3)';
            return`<button class="card" data-book-filter="${b}" style="padding:11px 14px;display:flex;align-items:center;gap:10px;border:none;cursor:pointer;text-align:left;background:${S.addBookFilter===b?col+'18':'var(--paper)'};outline:${S.addBookFilter===b?`2px solid ${col}`:'none'}">
              <div style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0"></div>
              <span style="font-size:13px;font-weight:600;color:var(--ink);flex:1">${b==='All'?'All Books · 所有':bk?bk.title:b}</span>
              <span style="font-size:12px;color:var(--ink-4)">${count}</span>
            </button>`;
          }).join('')}
        </div>`
      }
      </div>
      ${!S.addShowForm
        ?`<button class="btn btn-primary" data-action="show-add" style="width:100%;padding:13px;font-size:14px;gap:8px;margin-bottom:14px">${ic('plus',16,'#fff')} Add Custom Word · 添加单词</button>`
        :`<div class="card card-lg" style="padding:18px;margin-bottom:14px;animation:mp-fadein .2s">
            <div style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:14px">Add New Word · 添加新单词</div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <div>
                <div style="font-size:11px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">English Word *</div>
                <input id="add-word" placeholder="e.g. Hypertension" value="${S.addWord.replace(/"/g,'&quot;')}"
                  style="width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--hair);font-size:14px;background:var(--paper)">
              </div>
              <div>
                <div style="font-size:11px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Chinese · 中文 *</div>
                <input id="add-zh" placeholder="e.g. 高血压" value="${S.addZh.replace(/"/g,'&quot;')}"
                  style="width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--hair);font-size:14px;background:var(--paper)">
              </div>
              <div>
                <div style="font-size:11px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Definition (optional)</div>
                <input id="add-def" placeholder="e.g. Abnormally high blood pressure" value="${S.addDef.replace(/"/g,'&quot;')}"
                  style="width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--hair);font-size:14px;background:var(--paper)">
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
              <button class="btn btn-ghost" data-action="cancel-add" style="padding:11px;font-size:14px">Cancel</button>
              <button class="btn btn-primary" data-action="save-word" style="padding:11px;font-size:14px">Save · 保存</button>
            </div>
          </div>`
      }
      ${cv.length>0?`
        <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px">My Custom Words · 我的单词 (${cv.length})</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${cv.map((w,i)=>`<div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:10px">
            <span style="font-size:20px">${w.emoji||'📝'}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:700;color:var(--ink)">${w.word}</div>
              <div style="font-size:12px;color:var(--ink-3)">${w.zh}${w.def?` · ${w.def}`:''}</div>
            </div>
            <button class="btn" data-del="${i}" style="padding:6px;border-radius:8px;background:var(--beige)">${ic('close',14,'var(--ink-4)')}</button>
          </div>`).join('')}
        </div>`:''}
    </div>
    ${tabbar('words')}
  </div>`;
}

function navPill(){
  const screens=['login','home','learn','review','quiz','words','me','doctor'];
  return`<div class="nav-pill">${screens.map(s=>`<button class="nav-btn" data-go="${s}" style="background:${S.screen===s?'var(--accent)':'transparent'};color:${S.screen===s?'#fff':'var(--ink-3)'}">${s}</button>`).join('')}</div>`;
}

function tweaksPanel(){
  const labels={mint:'Mint 薄荷',coral:'Coral 珊瑚',lavender:'Lavender 薰衣草',slate:'Slate 石板'};
  return`<button class="tweaks-btn" data-action="toggle-tweaks">${ic('settings',20,'var(--ink-3)')}</button>
  ${S.tweaksOpen?`<div class="tweaks-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="font-size:13px;font-weight:700;color:var(--ink)">Tweaks · 设置</span>
      <button class="btn" data-action="toggle-tweaks" style="padding:2px">${ic('close',16,'var(--ink-3)')}</button>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Accent Color · 主题色</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
      ${Object.entries(ACCENT_COLORS).map(([k,c])=>`<button class="btn" data-accent="${k}" style="padding:8px 10px;border-radius:11px;background:${S.accent===k?c.main+'22':'var(--beige)'};outline:2px solid ${S.accent===k?c.main:'transparent'};gap:7px">
        <div style="width:18px;height:18px;border-radius:6px;background:${c.main};flex-shrink:0"></div>
        <span style="font-size:11px;font-weight:600;color:${S.accent===k?c.d700:'var(--ink-3)'}">${labels[k]}</span>
      </button>`).join('')}
    </div>
  </div>`:''}`;
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════════════════════════ */
const screens={login:loginScreen,home:homeScreen,learn:learnScreen,
  review:reviewScreen,quiz:quizScreen,me:profileScreen,doctor:doctorScreen,words:wordsScreen};

function render(){
  const fn=screens[S.screen]||homeScreen;
  document.getElementById('app').innerHTML=`${navPill()}${fn()}${tweaksPanel()}`;
  bind();
  // Restore flip state
  if(S.screen==='learn'&&S.cardFlipped){
    const fi=document.getElementById('flip-inner');
    if(fi)fi.classList.add('flipped');
  }
  // Restore spell input focus + value
  if(S.screen==='quiz'&&S.quizMode==='spell'){
    const inp=document.getElementById('spell-input');
    if(inp){inp.value=S.quizSpelled;inp.focus();}
  }
  // Restore review flip state
  if(S.reviewSession.length&&S.reviewIdx<S.reviewSession.length&&S.reviewFlipped){
    const ri=document.getElementById('rv-inner');
    if(ri)ri.classList.add('flipped');
  }
  // Keep search input focused
  if(S.screen==='words'){
    const si=document.getElementById('word-search');
    if(si){const v=si.value;si.focus();si.setSelectionRange(v.length,v.length);}
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   EVENTS
══════════════════════════════════════════════════════════════════════════ */
function bind(){
  // Navigation: data-go
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      if(el.dataset.book!==undefined){S.currentBook=el.dataset.book||null;S.cardIdx=0;}
      go(el.dataset.go);
    });
  });

  // Flip card
  const fc=document.querySelector('.flip-card');
  if(fc){
    let _ft=false;
    const doFlip=()=>{S.cardFlipped=!S.cardFlipped;const fi=document.getElementById('flip-inner');if(fi)fi.classList.toggle('flipped',S.cardFlipped);};
    fc.addEventListener('touchstart',e=>{if(e.target.closest('[data-action]'))return;_ft=true;doFlip();},{passive:true});
    fc.addEventListener('click',e=>{if(e.target.closest('[data-action]'))return;if(_ft){_ft=false;return;}doFlip();});
  }

  // Prev / Next card
  document.querySelector('[data-action="prev-card"]')?.addEventListener('click',e=>{
    e.stopPropagation();
    if(S.cardIdx>0){S.cardIdx--;S.cardFlipped=false;render();}
  });
  document.querySelector('[data-action="next-card"]')?.addEventListener('click',e=>{
    e.stopPropagation();
    const cv=currentVocab();if(S.cardIdx<cv.length-1){S.cardIdx++;S.cardFlipped=false;render();}
  });
  document.querySelector('[data-action="know"]')?.addEventListener('click',e=>{
    e.stopPropagation();
    const cv=currentVocab();
    const w=cv[S.cardIdx];if(w)markWord(w.id,true);
    if(S.cardIdx<cv.length-1){S.cardIdx++;S.cardFlipped=false;render();}
  });

  // Play wave + speech
  ['','-login','-card'].forEach(sfx=>{
    document.querySelector(`[data-action="play${sfx}"]`)?.addEventListener('click',e=>{
      e.stopPropagation();
      const bars=e.currentTarget.querySelectorAll('.wave-bar');
      bars.forEach(b=>b.classList.add('active'));
      if(window.speechSynthesis && sfx==='-card'){
        const word=currentVocab()[S.cardIdx]?.word||'';
        window.speechSynthesis.cancel();
        const utt=new SpeechSynthesisUtterance(word);
        utt.lang='en-US';utt.rate=0.85;
        utt.onend=()=>bars.forEach(b=>b.classList.remove('active'));
        window.speechSynthesis.speak(utt);
      } else {
        setTimeout(()=>bars.forEach(b=>b.classList.remove('active')),2000);
      }
    });
  });

  // Shuffle
  document.querySelector('[data-action="shuffle"]')?.addEventListener('click',e=>{
    e.stopPropagation();
    S.cardIdx=Math.floor(Math.random()*currentVocab().length);
    S.cardFlipped=false;render();
  });

  // Quiz mode
  document.querySelectorAll('[data-quiz-mode]').forEach(el=>{
    el.addEventListener('click',()=>{S.quizMode=el.dataset.quizMode;S.quizPicked=null;S.quizSpelled='';render();});
  });

  // Quiz MC options
  document.querySelectorAll('[data-quiz-opt]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(S.quizPicked===null){S.quizPicked=parseInt(el.dataset.quizOpt);render();}
    });
  });

  // Next quiz
  document.querySelector('[data-action="next-quiz"]')?.addEventListener('click',()=>{
    S.quizIdx++;S.quizPicked=null;S.quizSpelled='';S.quizOptions=null;S.quizScore+=10;render();
  });

  // Spell input — live, no re-render
  document.getElementById('spell-input')?.addEventListener('input',e=>{
    S.quizSpelled=e.target.value;
    const ok=S.quizSpelled.toLowerCase()===VOCAB[S.quizIdx%VOCAB.length].word.toLowerCase()&&S.quizSpelled.length>0;
    const fb=document.getElementById('spell-feedback');
    if(fb)fb.innerHTML=S.quizSpelled
      ?`<div style="padding:10px 14px;border-radius:12px;background:${ok?'var(--mint-50)':'#FBEEE8'};font-size:13px;font-weight:600;color:${ok?'var(--mint-700)':'#B15233'}">${ok?'✓ Correct! · 正确！':'✗ Keep trying · 继续尝试'}</div>`:'';
    // Show next button when correct
    if(ok){
      let nb=document.querySelector('[data-action="next-quiz"]');
      if(!nb){
        nb=document.createElement('button');
        nb.className='btn btn-primary';
        nb.dataset.action='next-quiz';
        nb.style.cssText='width:100%;padding:14px;font-size:15px;margin-top:8px;animation:mp-fadein .2s;border:none;cursor:pointer;font-family:inherit';
        nb.textContent='Next word · 下一个 →';
        fb.parentNode.appendChild(nb);
        nb.addEventListener('click',()=>{S.quizIdx++;S.quizPicked=null;S.quizSpelled='';S.quizOptions=null;S.quizScore+=10;render();});
      }
    }
  });

  // Doctor: body part
  document.querySelectorAll('[data-part]').forEach(el=>{
    el.addEventListener('click',()=>{S.doctorPart=el.dataset.part;S.doctorSelected=new Set();render();});
  });

  // Doctor: symptom
  document.querySelectorAll('[data-symptom]').forEach(el=>{
    el.addEventListener('click',()=>{
      const s=el.dataset.symptom;
      S.doctorSelected.has(s)?S.doctorSelected.delete(s):S.doctorSelected.add(s);
      render();
    });
  });

  // Doctor: duration
  document.querySelectorAll('[data-dur]').forEach(el=>{
    el.addEventListener('click',()=>{S.doctorDuration=el.dataset.dur;render();});
  });

  // Tweaks toggle
  document.querySelector('[data-action="toggle-tweaks"]')?.addEventListener('click',()=>{
    S.tweaksOpen=!S.tweaksOpen;render();
  });

  // Accent swatches
  document.querySelectorAll('[data-accent]').forEach(el=>{
    el.addEventListener('click',()=>{applyAccent(el.dataset.accent);render();});
  });

  // ── Review: flip card ────────────────────────────────────────────────────
  const rvc=document.getElementById('rv-card');
  if(rvc){
    let _rt=false;
    const doRvFlip=()=>{S.reviewFlipped=!S.reviewFlipped;const ri=document.getElementById('rv-inner');if(ri)ri.classList.toggle('flipped',S.reviewFlipped);};
    rvc.addEventListener('touchstart',e=>{if(e.target.closest('[data-action]'))return;_rt=true;doRvFlip();},{passive:true});
    rvc.addEventListener('click',e=>{if(e.target.closest('[data-action]'))return;if(_rt){_rt=false;return;}doRvFlip();});
  }

  // ── Review: start / end / know / dont ───────────────────────────────────
  document.querySelector('[data-action="rv-start"]')?.addEventListener('click',()=>{
    const rd=loadRD();const now=Date.now();
    const due=allVocab().filter(w=>{const d=rd[w.id];return d&&d.nextDue<=now;});
    startReview(due.length?due:allVocab());render();
  });
  document.querySelector('[data-action="rv-all"]')?.addEventListener('click',()=>{
    startReview(allVocab());render();
  });
  document.querySelector('[data-action="rv-know"]')?.addEventListener('click',()=>{
    const id=S.reviewSession[S.reviewIdx];if(id!=null)markWord(id,true);
    S.reviewKnow++;S.reviewIdx++;S.reviewFlipped=false;
    if(S.reviewIdx>=S.reviewSession.length)S.reviewDone=true;
    render();
  });
  document.querySelector('[data-action="rv-dont"]')?.addEventListener('click',()=>{
    const id=S.reviewSession[S.reviewIdx];if(id!=null)markWord(id,false);
    S.reviewIdx++;S.reviewFlipped=false;
    if(S.reviewIdx>=S.reviewSession.length)S.reviewDone=true;
    render();
  });
  document.querySelector('[data-action="end-review"]')?.addEventListener('click',()=>{
    S.reviewSession=[];S.reviewDone=false;render();
  });
  document.querySelector('[data-action="rv-again"]')?.addEventListener('click',()=>{
    startReview(allVocab().filter(w=>S.reviewSession.includes(w.id)));render();
  });

  // ── Words: search ────────────────────────────────────────────────────────
  document.getElementById('word-search')?.addEventListener('input',e=>{
    S.addSearch=e.target.value;
    // live update results without full re-render to keep focus
    const q=S.addSearch.trim().toLowerCase();
    const av=allVocab();
    const results=q?av.filter(w=>w.word.toLowerCase().includes(q)||w.zh.includes(S.addSearch)||(w.def||'').toLowerCase().includes(q)):[];
    const container=document.getElementById('search-results');
    if(container){
      if(!q){container.innerHTML='';return;}
      container.innerHTML=results.length>0
        ?results.map(w=>`<div class="card" style="padding:13px 14px;margin-bottom:8px"><div style="display:flex;align-items:flex-start;gap:10px"><span style="font-size:22px;flex-shrink:0">${w.emoji||'📖'}</span><div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap"><span style="font-size:16px;font-weight:700;color:var(--ink)">${w.word}</span><span style="font-size:11px;color:var(--ink-4);font-family:var(--mono)">${w.ipa||''}</span><span class="tag" style="background:var(--mint-50);color:var(--mint-700);font-size:10px">${w.zh}</span></div><p style="font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.5">${w.def||''}</p></div></div></div>`).join('')
        :`<div class="card" style="padding:20px;text-align:center;margin-bottom:8px"><p style="font-size:28px;margin-bottom:8px">🔍</p><p style="font-size:14px;font-weight:600;color:var(--ink-2)">Not found in vocabulary</p><p style="font-size:12px;color:var(--ink-4);margin-top:4px">Add it as a custom word below</p></div>`;
    } else {render();}
  });
  document.getElementById('clear-search')?.addEventListener('click',()=>{
    S.addSearch='';render();
  });

  // ── Words: book filter ───────────────────────────────────────────────────
  document.querySelectorAll('[data-book-filter]').forEach(el=>{
    el.addEventListener('click',()=>{S.addBookFilter=el.dataset.bookFilter;render();});
  });

  // ── Words: add form ──────────────────────────────────────────────────────
  document.querySelector('[data-action="show-add"]')?.addEventListener('click',()=>{
    S.addShowForm=true;render();
  });
  document.querySelector('[data-action="cancel-add"]')?.addEventListener('click',()=>{
    S.addShowForm=false;S.addWord='';S.addZh='';S.addDef='';render();
  });
  document.getElementById('add-word')?.addEventListener('input',e=>{S.addWord=e.target.value;});
  document.getElementById('add-zh')?.addEventListener('input',e=>{S.addZh=e.target.value;});
  document.getElementById('add-def')?.addEventListener('input',e=>{S.addDef=e.target.value;});
  document.querySelector('[data-action="save-word"]')?.addEventListener('click',()=>{
    const word=S.addWord.trim();const zh=S.addZh.trim();
    if(!word||!zh){alert('Please enter both English and Chinese · 请输入英文和中文');return;}
    const cv=loadCV();
    const newId=9000+cv.length;
    cv.push({id:newId,word,zh,def:S.addDef.trim(),ipa:'',pos:'',book:'custom',emoji:'📝',sentence:'',zhSentence:'',mnemonic:''});
    saveCV(cv);
    S.addShowForm=false;S.addWord='';S.addZh='';S.addDef='';
    render();
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click',()=>{
      const cv=loadCV();cv.splice(parseInt(el.dataset.del),1);saveCV(cv);render();
    });
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════════════ */
render();
</script>
</body>
</html>
