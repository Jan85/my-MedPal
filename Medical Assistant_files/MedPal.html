<style>
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; width: 100%;
    background: radial-gradient(1200px 800px at 50% 40%, #F3EEE1, #E0DBCB 70%);
    overflow: hidden;
  }
  #root { width: 100%; height: 100%; }
  .stage {
    display: flex; gap: 80px; align-items: center; justify-content: center;
    padding: 40px;
  }
  .phone-shell {
    width: 402px; height: 874px; border-radius: 56px;
    background: #1B2420;
    padding: 10px;
    box-shadow:
      0 50px 100px rgba(27,36,32,0.25),
      0 20px 40px rgba(27,36,32,0.15),
      inset 0 0 0 1px rgba(255,255,255,0.04),
      inset 0 2px 4px rgba(255,255,255,0.08);
    position: relative;
  }
  .phone-inner {
    width: 100%; height: 100%;
    border-radius: 46px; overflow: hidden;
    position: relative; background: #FBF8F1;
  }
  /* Dynamic island */
  .island {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 24px;
    background: #000; z-index: 200; pointer-events: none;
  }
  /* Home indicator */
  .home-ind {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 139px; height: 5px; border-radius: 100px;
    background: rgba(27,36,32,0.3); z-index: 200; pointer-events: none;
  }
  .screen-wrapper {
    position: absolute; inset: 0;
  }

  /* Caption */
  .device-caption {
    text-align: center; margin-top: 18px;
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11px; color: #6B7A74; letter-spacing: 0.5px;
  }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; bottom: 24px; right: 24px;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 16px; width: 240px;
    box-shadow: 0 20px 40px rgba(27,36,32,0.12), 0 4px 12px rgba(27,36,32,0.08);
    z-index: 1000;
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    display: none;
  }
  .tweaks-panel.open { display: block; }
  .tweaks-title {
    font-size: 13px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .tweaks-label {
    font-size: 11px; color: #6B7A74; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
    border: 2px solid transparent; transition: transform 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .swatch.active { border-color: #1B2420; transform: scale(1.05); }
  .swatch svg { opacity: 0; }
  .swatch.active svg { opacity: 1; }

  /* Nav dots for launcher */
  .screen-menu {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 8px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    border-radius: 999px; z-index: 500;
    box-shadow: 0 4px 12px rgba(27,36,32,0.08);
    font-family: -apple-system, system-ui, sans-serif;
  }
  .screen-menu button {
    border: none; background: transparent; cursor: pointer;
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: #6B7A74;
    font-family: inherit;
  }
  .screen-menu button.active {
    background: var(--accent, #7FD1AE); color: #fff;
  }
</style>

<script>
  // EDIT MODE defaults
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "mint"
  }/*EDITMODE-END*/;

  const ACCENT_COLORS = {
    mint: { main: '#7FD1AE', d600: '#5DBA93', d700: '#3E9E75', l50: '#EAF7F0', l100: '#D6EFDF' },
    coral: { main: '#E8896B', d600: '#D26B4C', d700: '#B15233', l50: '#FBEEE8', l100: '#F4D5C7' },
    lavender: { main: '#B8A4D4', d600: '#9A83BC', d700: '#7B669B', l50: '#F0EBF6', l100: '#DED2EC' },
    slate: { main: '#7B9BA8', d600: '#5D7E8D', d700: '#456674', l50: '#E9F0F3', l100: '#CADBE2' },
  };

  function applyAccent(key) {
    const c = ACCENT_COLORS[key] || ACCENT_COLORS.mint;
    const r = document.documentElement;
    r.style.setProperty('--accent', c.main);
    r.style.setProperty('--mint', c.main);
    r.style.setProperty('--mint-600', c.d600);
    r.style.setProperty('--mint-700', c.d700);
    r.style.setProperty('--mint-50', c.l50);
    r.style.setProperty('--mint-100', c.l100);
    r.style.setProperty('--sh-mint',
      `0 8px 24px ${c.main}4D, 0 2px 6px ${c.d700}26`);
  }
  applyAccent(TWEAK_DEFAULTS.accent);

  // Tweaks UI
  const swatchContainer = document.getElementById('accent-swatches');
  let currentAccent = TWEAK_DEFAULTS.accent;
  Object.entries(ACCENT_COLORS).forEach(([key, c]) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (key === currentAccent ? ' active' : '');
    b.style.background = c.main;
    b.title = key;
    b.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
    b.onclick = () => {
      currentAccent = key;
      applyAccent(key);
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      b.classList.add('active');
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accent: key } }, '*');
    };
    swatchContainer.appendChild(b);
  });

  // Edit mode protocol
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === '__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('open');
    if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('open');
  });
  window.parent.postMessage({ type: '__edit_mode_available' }, '*');
</script>

<script type="text/babel" data-presets="react" data-plugins="transform-react-jsx-source" data-filename="inline-5">
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('medpal_screen') || 'login');

  React.useEffect(() => { localStorage.setItem('medpal_screen', screen); }, [screen]);

  const go = (s) => setScreen(s);

  // Determine which tab is active
  const tabScreens = ['home', 'learn', 'review', 'quiz', 'me'];
  const isTabScreen = tabScreens.includes(screen);

  const renderScreen = () => {
    switch (screen) {
      case 'login': return <LoginScreen onLogin={() => go('home')}/>;
      case 'home': return <HomeScreen go={go}/>;
      case 'learn': return <LearnScreen go={go}/>;
      case 'review': return <ReviewScreen go={go}/>;
      case 'quiz': return <QuizScreen go={go}/>;
      case 'me': return <ProfileScreen go={go}/>;
      case 'doctor': return <DoctorScreen go={go}/>;
      default: return <HomeScreen go={go}/>;
    }
  };

  const labels = {
    login: 'Splash · 登录',
    home: 'Home · 首页',
    learn: 'Learn · 学习',
    review: 'Review · 复习',
    quiz: 'Quiz · 测验',
    me: 'Profile · 我的',
    doctor: 'Doctor helper · 看诊助手',
  };

  return (
    <div className="stage">
      {/* Quick nav */}
      <div className="screen-menu">
        {Object.keys(labels).map(k => (
          <button key={k} onClick={() => go(k)} className={screen === k ? 'active' : ''}>
            {labels[k].split(' · ')[0]}
          </button>
        ))}
      </div>

      <div>
        <div className="phone-shell" data-screen-label={`MedPal · ${labels[screen]}`}>
          <div className="phone-inner">
            <div className="screen-wrapper mp-screen-enter" key={screen}>
              {renderScreen()}
              {isTabScreen && <TabBar current={screen} setCurrent={go}/>}
            </div>
            <div className="island"/>
            <div className="home-ind"/>
          </div>
        </div>
        <div className="device-caption">{labels[screen].toUpperCase()}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
